[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-microstructure"
version = "1.0.0"
description = "Feature-combination states for short-horizon prediction in cryptocurrency market microstructure (BTC/ETH on Binance)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marco Salzer" }]
keywords = ["limit-order-book", "market-microstructure", "cryptocurrency", "feature-engineering", "clustering"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<3.0",
    "pyarrow>=12.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
analysis = ["shap>=0.42", "optuna>=3.0", "openpyxl>=3.1"]
ingestion = ["websockets>=11.0", "aiohttp>=3.8", "orjson>=3.8", "prometheus-client>=0.16", "python-dotenv>=1.0"]
neural = ["torch>=2.0"]
dev = ["ruff>=0.1", "pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["collection*", "etl*", "selection*", "prediction*", "common*"]

[tool.ruff]
line-length = 110
target-version = "py310"
